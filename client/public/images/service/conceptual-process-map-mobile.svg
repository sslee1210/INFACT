<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1260" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc">
  <title id="title">개념설계 수행 프로세스</title>
  <desc id="desc">사전자료 수집부터 최종 문서화까지 이어지는 5단계 개념설계 수행 절차</desc>
  <rect width="720" height="1260" fill="#ffffff"/>
  <text x="56" y="70" fill="#071d63" font-family="Arial, sans-serif" font-size="34" font-weight="700">개념설계 수행 프로세스</text>
  <text x="56" y="108" fill="#66728f" font-family="Arial, sans-serif" font-size="19">질의서와 단계별 워크숍을 통해 설계 기준을 구체화합니다.</text>
  <line x1="92" y1="202" x2="92" y2="1004" stroke="#bac7e2" stroke-width="4"/>
  <g font-family="Arial, sans-serif">
    <circle cx="92" cy="218" r="29" fill="#122f91"/>
    <text x="92" y="226" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">01</text>
    <rect x="142" y="154" width="522" height="142" fill="#f5f8fd" stroke="#cbd6ea"/>
    <text x="170" y="194" fill="#071d63" font-size="25" font-weight="700">사전자료 수집</text>
    <text x="170" y="232" fill="#3f4c6b" font-size="19">프로젝트 개요 · 생산품목 · 목표 생산량</text>
    <text x="170" y="264" fill="#3f4c6b" font-size="19">기존 도면과 일정 확인</text>
    <circle cx="92" cy="408" r="29" fill="#2448a9"/>
    <text x="92" y="416" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">02</text>
    <rect x="142" y="344" width="522" height="142" fill="#f5f8fd" stroke="#cbd6ea"/>
    <text x="170" y="384" fill="#071d63" font-size="25" font-weight="700">공정 분석</text>
    <text x="170" y="422" fill="#3f4c6b" font-size="19">제조공정 · 주요 장비 · 처리 용량</text>
    <text x="170" y="454" fill="#3f4c6b" font-size="19">원자재와 폐기물 흐름 분석</text>
    <circle cx="92" cy="598" r="29" fill="#355bb5"/>
    <text x="92" y="606" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">03</text>
    <rect x="142" y="534" width="522" height="142" fill="#f5f8fd" stroke="#cbd6ea"/>
    <text x="170" y="574" fill="#071d63" font-size="25" font-weight="700">레이아웃 개발</text>
    <text x="170" y="612" fill="#3f4c6b" font-size="19">작업실 · 장비 · 청정구역 배치</text>
    <text x="170" y="644" fill="#3f4c6b" font-size="19">작업자 · 자재 · 폐기물 동선 검토</text>
    <circle cx="92" cy="788" r="29" fill="#5274bf"/>
    <text x="92" y="796" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">04</text>
    <rect x="142" y="724" width="522" height="142" fill="#f5f8fd" stroke="#cbd6ea"/>
    <text x="170" y="764" fill="#071d63" font-size="25" font-weight="700">설계 조정</text>
    <text x="170" y="802" fill="#3f4c6b" font-size="19">차압 · 에어락 · 공정 유틸리티</text>
    <text x="170" y="834" fill="#3f4c6b" font-size="19">보관과 배수 조건 검토</text>
    <circle cx="92" cy="978" r="29" fill="#708bc8"/>
    <text x="92" y="986" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">05</text>
    <rect x="142" y="914" width="522" height="142" fill="#f5f8fd" stroke="#cbd6ea"/>
    <text x="170" y="954" fill="#071d63" font-size="25" font-weight="700">최종 문서화</text>
    <text x="170" y="992" fill="#3f4c6b" font-size="19">확정 도면 · 분석표 · 검토 기록</text>
    <text x="170" y="1024" fill="#3f4c6b" font-size="19">개념설계 최종 보고서</text>
  </g>
  <rect x="56" y="1108" width="608" height="94" fill="#eaf0fa"/>
  <text x="84" y="1148" fill="#071d63" font-family="Arial, sans-serif" font-size="17" font-weight="700">INPUT</text>
  <text x="188" y="1148" fill="#3f4c6b" font-family="Arial, sans-serif" font-size="17">프로젝트 기초자료 · 공정정보 · 운영조건</text>
  <text x="84" y="1180" fill="#071d63" font-family="Arial, sans-serif" font-size="17" font-weight="700">OUTPUT</text>
  <text x="188" y="1180" fill="#3f4c6b" font-family="Arial, sans-serif" font-size="17">최종 도면 · 분석자료 · 개념설계 보고서</text>
</svg>
