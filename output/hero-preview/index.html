<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IN-FACT · 히어로 로고 대비 비교</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222b38;font-family:Arial,"Malgun Gothic",sans-serif}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 28px;background:#fff;border-bottom:1px solid #e0e4eb}
    h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.04em}.caption{margin:7px 0 0;font-size:12px;color:#667487}
    .choices{display:flex;gap:5px;padding:4px;background:#eef0f4;border-radius:10px}
    button{min-height:42px;padding:10px 16px;border:0;border-radius:7px;background:transparent;color:#596477;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
    button[aria-pressed="true"]{background:#30358b;color:#fff}button:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
    .canvas{padding:18px 22px 0}iframe{display:block;width:100%;height:max(520px,calc(100svh - 176px));border:0;border-radius:10px;background:#3f5d78;pointer-events:none}
    .note{margin:0;padding:16px 28px 20px;font-size:13px;line-height:1.65;color:#526074}.note strong{color:#30358b}
    @media(max-width:760px){.toolbar{align-items:stretch;flex-direction:column;padding:14px 16px;gap:14px}.choices{width:100%}.choices button{flex:1;padding:9px 6px;font-size:12px}.canvas{padding:10px 10px 0}iframe{height:660px;min-height:0}.note{padding:14px 16px}h1{font-size:16px}}
  </style>
</head>
<body>
  <header class="toolbar">
    <div><h1>원본 로고 · 배경 대비 비교</h1><p class="caption">실제 페이지에 미적용 · 모든 시안에서 원본 로고 색·형태·크기 유지</p></div>
    <div class="choices" role="group" aria-label="디자인 시안 선택">
      <button data-mode="original" aria-pressed="false">현재 디자인</button>
      <button data-mode="dawn" aria-pressed="true">해 뜨기 전 새벽</button>
      <button data-mode="blue" aria-pressed="false">조금 더 푸른 새벽</button>
    </div>
  </header>
  <main class="canvas"><iframe id="preview" src="/#/" title="IN-FACT 히어로 디자인 시안" tabindex="-1"></iframe></main>
  <p class="note" id="note" aria-live="polite">현재 홈페이지를 불러오고 있습니다.</p>
  <script>
    const frame=document.querySelector('#preview');
    const note=document.querySelector('#note');
    const buttons=[...document.querySelectorAll('[data-mode]')];
    let mode='dawn', stylesheet;
    const notes={
      original:'현재 디자인: 짙은 파란 로고와 청회색 배경의 밝기가 비슷해 로고의 윗부분이 묻힙니다.',
      dawn:'해 뜨기 전 하늘처럼 위쪽은 차분한 청색, 아래쪽은 밝은 회청색으로 자연스럽게 이어집니다. 로고 주변의 별도 빛은 완전히 제거했고, 원본 로고와 작은 별빛은 유지했습니다. 실제 홈페이지에는 미적용 상태입니다.',
      blue:'같은 새벽 분위기에서 푸른 기운을 조금 더 남긴 안입니다. 로고 주변의 별도 색이나 빛 없이 배경 전체의 색으로만 조정했습니다. 원본 로고와 별빛 효과는 그대로입니다.'
    };
    const common=`html,body{overflow:hidden!important;scroll-behavior:auto!important}
      .home-main > :not(.hero),footer{display:none!important}
      .home-main .hero,.home-main .hero__inner{height:100svh!important;min-height:100svh!important;max-height:none!important}
      .hero__completion{grid-template-rows:1fr!important;opacity:1!important;transform:none!important}
      .hero__brand-logo,.hero__title{animation:none!important;opacity:1!important;transform:none!important}`;
    function render(){
      buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));
      if(!stylesheet)return;
      const background=mode==='dawn'
        ?'linear-gradient(180deg,#405673 0%,#647b97 35%,#879ab1 68%,#b2bac5 100%)'
        :'linear-gradient(180deg,#344f70 0%,#597794 35%,#7f9ab2 68%,#a9bdca 100%)';
      stylesheet.textContent=common+(mode!=='original'?`
        .home-main .hero--particle-field{background:${background}!important}
        .home-main .hero--particle-field::before,.home-main .hero--particle-field::after{background:none!important;opacity:0!important}
        .home-main .hero__title,.home-main .hero__subtitle{color:#f3f6fb!important;text-shadow:none!important}
        .hero__brand-logo{filter:none!important}
      `:'');
      note.textContent=notes[mode];
    }
    buttons.forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;render()}));
    frame.addEventListener('load',async()=>{
      try{
        const doc=frame.contentDocument;
        for(let tries=0;!doc.querySelector('.hero__brand-logo');tries++){
          if(tries>100)throw new Error('홈페이지를 불러오지 못했습니다.');
          await new Promise(resolve=>setTimeout(resolve,100));
        }
        stylesheet=doc.createElement('style');doc.head.append(stylesheet);
        frame.contentWindow.scrollTo({top:0,behavior:'instant'});
        render();
      }catch(error){note.textContent='미리보기를 열지 못했습니다: '+error.message}
    });
  </script>
</body>
</html>
